<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>수영 메트로놈</title>
<style>
:root{--bg:#0b2a3a;--card:#12394d;--line:#25566e;--tx:#eef7fa;--mu:#8fb3c2;--done:#3de0c0;--rem:#2c5368;--rest:#ffb454;--bad:#ff7a7a}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:480px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px max(24px,env(safe-area-inset-bottom))}
h1{font-size:20px;margin:6px 0 12px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);background:transparent;color:var(--mu);border-radius:10px;font-size:15px}
.tabs button.on{background:var(--done);color:#06222c;border-color:var(--done);font-weight:700}
fieldset{border:1px solid var(--line);border-radius:12px;margin:0 0 10px;padding:10px 12px 12px}
legend{color:var(--mu);font-size:13px;padding:0 6px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
label{display:block;font-size:13px;color:var(--mu)}
input,select{width:100%;margin-top:3px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:16px}
.res{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px;min-height:20px}
.res b{color:var(--done)}.err{color:var(--bad)}
.row{display:flex;gap:8px;align-items:center}
.row label{flex:1}
.radio{display:flex;gap:8px;margin-bottom:8px}
.radio label{flex:1;color:var(--tx);font-size:15px;border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center}
.radio input{width:auto;margin:0 6px 0 0}
.btn{width:100%;padding:16px;border:0;border-radius:14px;font-size:18px;font-weight:700;background:var(--done);color:#06222c}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--line);font-size:16px;padding:14px}
.stepper{display:flex;gap:6px;align-items:flex-end}
.stepper button{width:46px;height:44px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:20px;flex:none}
.note{font-size:12px;color:var(--mu);margin-top:6px}
/* run */
.bar{height:26px;border-radius:13px;background:var(--rem);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;width:0;background:var(--done);transition:width .15s linear}
.bar.rest i{background:var(--rest)}
.bl{display:flex;justify-content:space-between;font-size:15px}
.bl .d{color:var(--done)}.bl .r{color:var(--mu)}
.pct{text-align:center;font-size:22px;font-weight:700;margin:2px 0 6px}
.big{text-align:center;font-size:104px;font-weight:800;line-height:1.05;margin:10px 0 0;letter-spacing:-2px}
.big.rest{color:var(--rest)}
.big2{text-align:center;font-size:52px;font-weight:800;color:var(--done);line-height:1.1;margin-top:2px;min-height:1.1em}
.cap{text-align:center;color:var(--mu);font-size:14px;margin-bottom:12px}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.st div{background:var(--card);border-radius:12px;padding:10px 6px;text-align:center}
.st b{display:block;font-size:26px}.st span{font-size:12px;color:var(--mu)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.sum{background:var(--card);border-radius:12px;padding:12px;margin-top:10px;font-size:15px}
.sum b{color:var(--done)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main id="setup">
<h1>수영 메트로놈</h1>
<div class="tabs"><button id="tAuto" class="on">자동 계산</button><button id="tMan">수동 설정</button></div>

<div id="pAuto">
<fieldset><legend>최근 기록 (가민)</legend>
<div class="g">
<label>거리 (m)<input id="cDist" type="number" inputmode="decimal" placeholder="1500"></label>
<label>기록 (분:초)<input id="cTime" inputmode="numeric" placeholder="30:00"></label>
<label>가민 평균 SPM<input id="cSpm" type="number" inputmode="decimal" step="0.1" placeholder="30"></label>
<label>총 스트로크 (선택)<input id="cStr" type="number" inputmode="numeric" placeholder="900"></label>
</div></fieldset>
<fieldset><legend>훈련 목표</legend>
<div class="g">
<label>목표 거리 (m)<input id="gDist" type="number" inputmode="decimal" placeholder="1500"></label>
<label>목표 페이스 (100m당)<input id="gPace" inputmode="numeric" placeholder="1:55"></label>
</div></fieldset>
</div>

<div id="pMan" hidden>
<fieldset><legend>직접 입력</legend>
<div class="stepper"><label style="flex:1">SPM (20.0~60.0)<input id="mSpm" type="number" inputmode="decimal" step="0.1" min="20" max="60" placeholder="30.0"></label>
<button id="m-">−</button><button id="m+">+</button></div>
<div class="g" style="margin-top:8px">
<label>총 거리 (m)<input id="mDist" type="number" inputmode="decimal" placeholder="1500"></label>
<label>페이스 (100m당)<input id="mPace" inputmode="numeric" placeholder="2:00"></label>
<label>총 시간 (분:초)<input id="mTime" inputmode="numeric" placeholder="30:00"></label>
</div>
<div class="note">페이스와 총 시간은 하나만 입력하면 나머지가 자동으로 채워집니다.</div>
</fieldset>
</div>

<div class="res" id="res"></div>

<fieldset><legend>실행 방식</legend>
<div class="radio"><label><input type="radio" name="rm" value="dist" checked>거리 모드</label><label><input type="radio" name="rm" value="int">인터벌 모드</label></div>
<div id="iv" hidden><div class="g" style="grid-template-columns:1fr 1fr 1fr">
<label>운동 (분)<input id="iw" type="number" inputmode="decimal" value="6"></label>
<label>휴식 (초)<input id="ir" type="number" inputmode="numeric" value="60"></label>
<label>세트<input id="is" type="number" inputmode="numeric" value="5"></label>
</div>
<div class="row" style="margin-top:8px"><button class="btn sec" data-r="30" style="padding:8px">30초</button><button class="btn sec" data-r="60" style="padding:8px">60초</button><button class="btn sec" data-r="90" style="padding:8px">90초</button></div></div>
</fieldset>

<fieldset><legend>비프음</legend>
<div class="row"><select id="snd"><option value="sine">사인 (부드러운 톤)</option><option value="wood">우드블록</option><option value="click">클릭</option><option value="low">저음</option><option value="pop">팝</option></select>
<button class="btn sec" id="prev" style="width:90px;padding:10px">들어보기</button></div></fieldset>

<button class="btn" id="go">시작</button>
<div class="note">스트로크 기준은 가민과 같은 양팔 1사이클입니다. 화면이 꺼지면 소리가 끊길 수 있어 실행 중에는 화면을 켜 둡니다. iPhone은 화면 잠금 시 소리가 멈출 수 있습니다.</div>
</main>

<main id="run" hidden>
<div id="barBox"><div class="bl"><span class="d" id="bd"></span><span class="r" id="br"></span></div>
<div class="bar" id="bar"><i id="bi"></i></div>
<div class="pct" id="pct"></div></div>
<div class="big" id="big"></div>
<div class="big2" id="big2"></div>
<div class="cap" id="cap"></div>
<div class="st"><div><b id="s1"></b><span id="l1"></span></div><div><b id="s2"></b><span id="l2"></span></div><div><b id="s3"></b><span id="l3"></span></div></div>
<div class="cap" id="tm"></div>
<div class="btns"><button class="btn sec" id="pause">일시정지</button><button class="btn sec" id="skip" hidden>휴식 건너뛰기</button><button class="btn sec" id="cont" hidden>계속하기</button><button class="btn sec" id="stop">종료</button></div>
<div class="sum" id="sum" hidden></div>
</main>

<script>
const $=id=>document.getElementById(id);
const pt=s=>{if(!s||!s.trim())return NaN;const p=s.trim().split(':').map(Number);return p.some(isNaN)?NaN:p.reduce((a,b)=>a*60+b,0)};
const ft=s=>{s=Math.round(Math.max(0,s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),r=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(r).padStart(2,'0')};
const IDS=['cDist','cTime','cSpm','cStr','gDist','gPace','mSpm','mDist','mPace','mTime','iw','ir','is','snd'];
let tab='auto';
const V=id=>$(id).value||$(id).placeholder;

/* ---------- 저장 / 불러오기 ---------- */
function save(){try{const o={tab,rm:document.querySelector('[name=rm]:checked').value};IDS.forEach(i=>o[i]=$(i).value);localStorage.setItem('swimmet',JSON.stringify(o))}catch(e){}}
function load(){try{const o=JSON.parse(localStorage.getItem('swimmet')||'{}');IDS.forEach(i=>{if(o[i]!=null)$(i).value=o[i]});if(o.rm)document.querySelector(`[name=rm][value=${o.rm}]`).checked=true;setTab(o.tab||'auto')}catch(e){}}

/* ---------- 입력 화면 ---------- */
function setTab(t){tab=t;$('pAuto').hidden=t!=='auto';$('pMan').hidden=t!=='man';$('tAuto').classList.toggle('on',t==='auto');$('tMan').classList.toggle('on',t==='man');render()}
$('tAuto').onclick=()=>setTab('auto');$('tMan').onclick=()=>setTab('man');

function compute(){
  const iv=document.querySelector('[name=rm]:checked').value==='int';
  let spm,dist=0,pace=0,sl=null,cp=null;
  if(tab==='auto'){
    const cd=+V('cDist'),ct=pt(V('cTime')),cs=+V('cSpm'),cst=+V('cStr')||0;
    dist=+V('gDist')||0;pace=pt(V('gPace'))||0;
    if(!(cd>0&&ct>0&&cs>0))return{err:'최근 기록의 거리, 기록, 가민 SPM을 입력하세요.'};
    cp=ct/cd*100;if(cst>0)sl=cd/cst;
    if(dist&&pace)spm=cs*cp/pace;else if(!iv)return{err:'목표 거리와 목표 페이스를 입력하세요.'};else spm=cs;
  }else{
    spm=+V('mSpm');dist=+V('mDist')||0;pace=pt(V('mPace'))||0;
    if(!iv&&!(dist&&pace))return{err:'거리 모드에는 거리와 페이스(또는 총 시간)가 필요합니다.'};
  }
  spm=Math.round(spm*10)/10;
  if(!(spm>=20&&spm<=60))return{err:'SPM은 20.0~60.0 범위여야 합니다. (현재 '+(spm||'-')+')'};
  const total=dist&&pace?dist*pace/100:0;
  let gs=0;
  if(total){gs=sl?dist/sl:spm*total/60;if(!sl)sl=dist/gs}
  return{spm,dist,pace,total,gs:Math.round(gs),sl,cp};
}
function render(){
  const c=compute(),r=$('res');
  if(c.err){r.innerHTML='<span class="err">'+c.err+'</span>';return}
  let h='<b>목표 SPM '+c.spm.toFixed(1)+'</b>';
  if(c.cp)h+='<br>현재 페이스 '+ft(c.cp)+'/100m';
  if(c.total)h+='<br>총 시간 '+ft(c.total)+' · 목표 스트로크 '+c.gs+'회<br>스트로크 길이 약 '+c.sl.toFixed(2)+'m';
  r.innerHTML=h;
}
document.addEventListener('input',e=>{
  if(e.target.id==='mPace'||e.target.id==='mDist'){const d=+V('mDist'),p=pt(V('mPace'));if(d&&p)$('mTime').value=ft(d*p/100)}
  if(e.target.id==='mTime'){const d=+V('mDist'),t=pt($('mTime').value);if(d&&t)$('mPace').value=ft(t/d*100)}
  $('iv').hidden=document.querySelector('[name=rm]:checked').value!=='int';
  render();save();
});
function stepSpm(d){const v=Math.round((+$('mSpm').value||30)*10+d)/10;$('mSpm').value=Math.min(60,Math.max(20,v)).toFixed(1);render();save()}
(()=>{let t;const hold=(id,d)=>{const b=$(id);const go=()=>{stepSpm(d);t=setTimeout(function f(){stepSpm(d*5);t=setTimeout(f,120)},450)};const end=()=>clearTimeout(t);
 b.addEventListener('pointerdown',e=>{e.preventDefault();go()});['pointerup','pointerleave','pointercancel'].forEach(n=>b.addEventListener(n,end))};hold('m-',-1);hold('m+',1)})();
document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{$('ir').value=b.dataset.r;save()});

/* ---------- 오디오 ---------- */
let ctx;const S={sine:[880,'sine',.09],wood:[1000,'triangle',.05],click:[2000,'square',.02],low:[440,'sine',.12],pop:[600,'sawtooth',.04]};
function A(){if(!ctx)ctx=new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();return ctx}
function tone(t,f,ty,d,v=.4){const o=ctx.createOscillator(),g=ctx.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+d+.02)}
const beep=t=>{const s=S[$('snd').value];tone(t,s[0],s[1],s[2])};
const up=t=>{tone(t,660,'sine',.15);tone(t+.16,990,'sine',.28)};
const down=t=>{tone(t,990,'sine',.15);tone(t+.16,660,'sine',.28)};
const cnt=t=>tone(t,1320,'square',.08,.22);
const fin=t=>[0,.2,.4].forEach((d,i)=>tone(t+d,[660,880,1320][i],'sine',.3));
$('prev').onclick=()=>{A();beep(ctx.currentTime+.05);beep(ctx.currentTime+.55)};

/* ---------- 실행 ---------- */
let cfg,mode,ph,pi,pS,pE,nextT,beats,total,setS,sets,over,ended,paused,tm,raf,lock,lastC,t0w,wkSets;
function start(){
  cfg=compute();if(cfg.err){alert(cfg.err);return}
  mode=document.querySelector('[name=rm]:checked').value;A();
  ph=[{t:'ready',d:3}];
  if(mode==='dist')ph.push({t:'work',d:Infinity});
  else{const w=Math.max(1,(+$('iw').value||6)*60),r=Math.max(0,+$('ir').value||0),n=Math.max(1,+$('is').value||1);wkSets=n;
    for(let i=0;i<n;i++){ph.push({t:'work',d:w});if(i<n-1&&r>0)ph.push({t:'rest',d:r})}}
  beats=[];total=0;setS=0;sets=[];over=false;ended=false;paused=false;t0w=null;
  $('setup').hidden=true;$('run').hidden=false;$('sum').hidden=true;
  $('barBox').hidden=false;$('cont').hidden=true;$('pause').textContent='일시정지';
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(l=>lock=l).catch(()=>{})}catch(e){}
  setPhase(0,ctx.currentTime+.15);
  tm=setInterval(sched,25);raf=requestAnimationFrame(frame);
}
function setPhase(i,t){
  pi=i;const p=ph[i];pS=t;pE=t+p.d;nextT=t;lastC=null;
  const now=Math.max(t,ctx.currentTime);
  if(p.t==='work'){setS=0;if(t0w===null)t0w=t;if(i>0)up(now)}
  if(p.t==='rest')down(now);
}
function sched(){
  if(paused||ended)return;const p=ph[pi];if(!p||p.t!=='work')return;
  const lim=ctx.currentTime+.12,step=60/cfg.spm;
  while(nextT<lim&&nextT<pE-.001){beep(Math.max(nextT,ctx.currentTime));beats.push(nextT);nextT+=step}
}
function frame(){
  const now=ctx.currentTime;
  while(beats.length&&beats[0]<=now){beats.shift();total++;setS++}
  const p=ph[pi];
  if(!ended&&p){
    if(p.t!=='work'){const sec=Math.ceil(pE-now);if(sec>=1&&sec<=3&&sec!==lastC){lastC=sec;cnt(now)}}
    if(mode==='dist'&&!over&&p.t==='work'&&total>=cfg.gs){over=true;ended=true;fin(now);finish()}
    else if(now>=pE){
      if(p.t==='work'&&mode==='int')sets.push(setS);
      if(pi+1<ph.length)setPhase(pi+1,pE);else{ended=true;fin(now);finish()}
    }
  }
  draw(now);raf=requestAnimationFrame(frame);
}
function draw(now){
  const p=ph[Math.min(pi,ph.length-1)];
  const rest=p.t==='rest',ready=p.t==='ready';
  $('bar').classList.toggle('rest',rest);
  $('big').classList.toggle('rest',rest||ready);
  const dn=cfg.sl?total*cfg.sl:0;
  if(ready){$('big').textContent=Math.max(1,Math.ceil(pE-now));$('cap').textContent='준비 · '+cfg.spm.toFixed(1)+' SPM';$('big2').textContent=''}
  else{
    if(rest){$('big').textContent=ft(Math.max(0,pE-now));$('cap').textContent='휴식 중 · 다음 세트 '+(sets.length+1)+'/'+wkSets}
    else{$('big').textContent=total;$('cap').textContent='스트로크'+(ended?' · 완료':'')}
    $('big2').textContent=dn?Math.round(mode==='dist'?Math.min(dn,cfg.dist):dn)+' m':'';
  }
  if(mode==='dist'){
    const pc=Math.min(100,dn/cfg.dist*100);
    $('bi').style.width=pc+'%';$('bd').textContent='수영 '+Math.round(Math.min(dn,cfg.dist))+'m';
    $('br').textContent='남은 '+Math.round(Math.max(0,cfg.dist-dn))+'m / 목표 '+cfg.dist+'m';$('pct').textContent=Math.floor(pc)+'%';
    $('s1').textContent=cfg.spm.toFixed(1);$('l1').textContent='SPM';
    $('s2').textContent=Math.max(0,cfg.gs-total);$('l2').textContent='남은 스트로크';
    $('s3').textContent=cfg.gs;$('l3').textContent='목표 스트로크';
    const el=t0w===null||ready?0:now-t0w;
    $('tm').textContent='경과 '+ft(el)+' / 남은 '+ft(Math.max(0,cfg.total-el));
  }else{
    const f=ready?0:(rest?(now-pS)/p.d:Math.min(1,(now-pS)/p.d));
    $('bi').style.width=Math.min(100,Math.max(0,f*100))+'%';
    $('bd').textContent=rest?'휴식':ready?'준비':'운동 '+(sets.length+1)+'/'+wkSets+'세트';
    $('br').textContent=ready?'':'남은 '+ft(Math.max(0,pE-now));
    $('pct').textContent='';
    const gs=Math.round(cfg.spm*(ph.find(x=>x.t==='work').d)/60);
    $('s1').textContent=rest?(sets[sets.length-1]??0):setS;$('l1').textContent=rest?'직전 세트':'세트 스트로크';
    $('s2').textContent=gs;$('l2').textContent='세트 목표';
    $('s3').textContent=cfg.spm.toFixed(1);$('l3').textContent='SPM';
    $('tm').textContent='';
  }
  $('skip').hidden=!(rest&&!ended);
}
function finish(){
  const dn=cfg.sl?total*cfg.sl:0,s=$('sum');let h='<b>훈련 완료</b><br>총 스트로크 '+total+'회';
  if(mode==='int')h+='<br>세트별: '+sets.map((v,i)=>(i+1)+'세트 '+v).join(' · ');
  if(dn)h+='<br>약 '+Math.round(dn)+'m'+(cfg.dist?' (목표의 '+Math.round(dn/cfg.dist*100)+'%)':'');
  if(mode==='dist'&&t0w!==null)h+='<br>경과 '+ft(ctx.currentTime-t0w);
  s.innerHTML=h;s.hidden=false;
  $('cont').hidden=!(mode==='dist');$('skip').hidden=true;
}
$('pause').onclick=()=>{
  if(ended)return;
  if(!paused){paused=true;ctx.suspend();$('pause').textContent='다시 시작'}
  else{paused=false;ctx.resume();$('pause').textContent='일시정지'}
};
$('skip').onclick=()=>{if(ph[pi].t==='rest'&&!ended){if(paused)$('pause').onclick();setPhase(pi+1,ctx.currentTime+.05)}};
$('cont').onclick=()=>{ended=false;$('sum').hidden=true;$('cont').hidden=true;nextT=ctx.currentTime+.1};
function stop(){
  clearInterval(tm);cancelAnimationFrame(raf);try{lock&&lock.release()}catch(e){}
  if(ctx.state==='suspended')ctx.resume();
  $('run').hidden=true;$('setup').hidden=false;
}
$('stop').onclick=stop;
$('go').onclick=start;
load();$('iv').hidden=document.querySelector('[name=rm]:checked').value!=='int';render();
</script>
</body>
</html>
